/**
 * 16 KB page-size support while staying on NDK r27.
 * Injects linker flags only into subprojects that compile native code (CMake/ndk-build).
 * App-level jniLibs packaging stays in android/app/build.gradle.
 */
def sixteenKbLinkerFlags = "-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"

def configureNative16KbLinkerFlags = { Project subproject ->
    def androidExt = subproject.extensions.findByName("android")
    if (androidExt == null) {
        return
    }

    def cmake = androidExt.defaultConfig?.externalNativeBuild?.cmake
    if (cmake != null) {
        cmake.arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        cmake.arguments "-DCMAKE_SHARED_LINKER_FLAGS=${sixteenKbLinkerFlags}"
        cmake.arguments "-DCMAKE_MODULE_LINKER_FLAGS=${sixteenKbLinkerFlags}"
        cmake.arguments "-DCMAKE_EXE_LINKER_FLAGS=${sixteenKbLinkerFlags}"
    }

    def ndkBuild = androidExt.defaultConfig?.externalNativeBuild?.ndkBuild
    if (ndkBuild != null) {
        ndkBuild.arguments "APP_LDFLAGS+=${sixteenKbLinkerFlags}"
    }
}

subprojects { subproject ->
    subproject.pluginManager.withPlugin("com.android.library") {
        subproject.afterEvaluate {
            configureNative16KbLinkerFlags(subproject)
        }
    }
}
